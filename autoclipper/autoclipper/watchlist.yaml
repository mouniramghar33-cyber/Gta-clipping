# The exclusive watchlist (verified 2026-11-18). Only these streamers are monitored; the system
# never adds streamers by itself. Channels are tried in order; the first live one is recorded,
# so a multistream is recorded once and a platform switch is followed automatically.
#
# Verification: Twitch channel pages (og:title/description), Kick public channel API
# (verified flag + followers), YouTube @handle canonical channel URL. Kick accounts with the
# same name but no verification and a handful of followers (kaicenat, jynxzi, marlon, tota,
# typicalgamer, ishowspeed, jasontheween) are name squatters and deliberately NOT listed.
