services:
  autoclipper:
    build: .
    image: autoclipper:latest
    container_name: autoclipper
    restart: unless-stopped          # restarts after crashes and server reboots
    env_file: .env                   # secrets live here (chmod 600), never in config.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data                 # config, database, clips, models, logs (persistent)
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    deploy:
      resources:
        limits:
          memory: 6g
